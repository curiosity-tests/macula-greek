name: Pull Request Actions
run-name: "Pull Request Actions ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  # Poetry and dependencies are cached to improve performance.
  # Caching cribbed from https://jacobian.org/til/github-actions-poetry/
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: true
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: cache poetry installation
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-1.2.2
      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.2.2
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ./test/.venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}-2
      - name: install dependencies
        run: poetry install --no-interaction
        working-directory: ./test
        if: steps.cache-deps.outputs.cache-hit != 'true'
      - name: execute pytest
        working-directory: ./test
        # `tee` obscures exit code.
        # `-o pipefail` forces an early fail.
        run: set -o pipefail; poetry run pytest | tee output.log
      - name: Archive test run output
        uses: actions/upload-artifact@v4
        with:
          name: test-run-output
          path: ./test/output.log
          retention-days: 8
